name: CI Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t devops-cicd-app .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-cicd-app
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag devops-cicd-app ghcr.io/${{ github.repository_owner }}/devops-cicd-app:latest
          docker push ghcr.io/${{ github.repository_owner }}/devops-cicd-app:latest

      - name: Run Docker container
        run: docker run devops-cicd-app
